[project]
name = "automaticgradingagentproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DuncanWu", email = "3133654963@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-deepseek>=1.1.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-cpp>=0.23.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
automaticgradingagentproject = "automaticgradingagentproject:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
